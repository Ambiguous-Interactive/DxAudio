<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-labelledby="dxaBannerTitle" aria-describedby="dxaBannerDesc">
  <title id="dxaBannerTitle">DxAudio: sound that composes</title>
  <desc id="dxaBannerDesc">A DxKit-family teal DxAudio banner: cue assets, pooled voices, ducks that stack.</desc>
  <!-- Geometry mirrors the DxMessaging banner (800x200, badge at 31,42, text at 132, card at 536). -->
  <defs>
    <linearGradient id="dxaBg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="0.62" stop-color="#10151d"/>
      <stop offset="1" stop-color="#101a19"/>
    </linearGradient>
    <linearGradient id="dxaTeal" x1="40" y1="32" x2="742" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8f0e0"/>
      <stop offset="0.48" stop-color="#2fd4b4"/>
      <stop offset="1" stop-color="#1a8f7a"/>
    </linearGradient>
    <filter id="dxaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="800" height="200" fill="url(#dxaBg)"/>
  <path d="M0 150 C112 126 178 170 302 142 C444 110 538 134 800 72 L800 200 L0 200 Z" fill="#2fd4b4" opacity="0.06"/>
  <g stroke="#2fd4b4" stroke-width="2" stroke-linecap="round" opacity="0.18">
    <line x1="360" y1="22" x2="360" y2="34"/><line x1="370" y1="16" x2="370" y2="40"/>
    <line x1="380" y1="24" x2="380" y2="32"/><line x1="390" y1="19" x2="390" y2="37"/>
  </g>

  <g transform="translate(31 42)" filter="url(#dxaShadow)">
    <polygon points="90,44 67,83.84 21,83.84 -2,44 21,4.16 67,4.16" fill="#0d1117" stroke="#222b36" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="84,44 64,78.64 24,78.64 4,44 24,9.36 64,9.36" fill="none" stroke="url(#dxaTeal)" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(-4 -4)" stroke="#a8f0e0" stroke-width="5" stroke-linecap="round">
      <line x1="30" y1="44" x2="30" y2="52"/><line x1="39" y1="37" x2="39" y2="59"/>
      <line x1="48" y1="31" x2="48" y2="65"/><line x1="57" y1="39" x2="57" y2="57"/>
      <line x1="66" y1="45" x2="66" y2="51"/>
    </g>
  </g>

  <g transform="translate(132 40)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.5" fill="#9aa3af">UNITY &#183; C#</text>
    <text x="0" y="44" font-family="'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#e9eef4">DxAudio</text>
    <text x="0" y="76" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#2fd4b4">Sound that composes.</text>
    <text x="0" y="100" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#9aa3af">Cue assets. Pooled voices. Ducks that stack.</text>
  </g>

  <g transform="translate(132 158)" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="800">
    <rect x="0" y="0" width="92" height="28" rx="8" fill="#2fd4b4"/>
    <text x="46" y="18" text-anchor="middle" fill="#0d1117">Zero alloc</text>
    <rect x="104" y="0" width="64" height="28" rx="8" fill="none" stroke="#4a5462" stroke-width="1.5"/>
    <text x="136" y="18" text-anchor="middle" fill="#c9d1d9">MIT-0</text>
    <!-- Version text must contain vX.Y.Z for version sync (milestone A2). -->
    <rect x="180" y="0" width="76" height="28" rx="8" fill="#0c1016" stroke="#232c38" stroke-width="1"/>
    <text data-sync="version" x="218" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="800" fill="#e9eef4">v0.4.0</text>
  </g>

  <g transform="translate(536 40)" filter="url(#dxaShadow)">
    <rect x="0" y="0" width="226" height="126" rx="8" fill="#0c1016" stroke="#232c38"/>
    <text x="18" y="26" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="800" letter-spacing="0.5" fill="#e9eef4">ONE MIX &#183; THREE LANES</text>
    <g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="700">
      <rect x="18" y="47" width="96" height="8" rx="4" fill="#2fd4b4"/>
      <text x="128" y="55" fill="#2fd4b4">SFX voices</text>
      <rect x="18" y="71" width="96" height="8" rx="4" fill="#8fa8ff"/>
      <text x="128" y="79" fill="#8fa8ff">Music fades</text>
      <rect x="18.75" y="95.75" width="94.5" height="6.5" rx="3.25" fill="none" stroke="#c9a7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="128" y="103" fill="#c9a7ff">Ducks compose</text>
    </g>
  </g>

  <text x="762" y="190" text-anchor="end" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#8b94a1">Wallstop Studios</text>
</svg>
