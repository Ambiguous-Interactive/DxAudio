name: DSP CPU throughput investigation

on:
  push:
    branches: [probe/dsp-thread-dispatch]

permissions:
  contents: read

jobs:
  eli:
    runs-on: [self-hosted, Windows, RAM-64GB, fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare fixed CPU work under original and high QoS
        shell: pwsh
        env:
          DOTNET_TieredCompilation: "0"
        run: ./.github/throughput-probe.ps1
