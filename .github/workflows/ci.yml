name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test the engine-free core
        run: dotnet test .net-tests --configuration Release

  package-checks:
    name: Format and meta files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .
      - name: Check every package asset has a .meta file
        run: python3 .github/scripts/meta_files.py --check
      - name: Check what npm would publish
        run: python3 .github/scripts/package_check.py
