name: Unity Tests

# One workflow and one licensed job cover every editor that runs (#62). The job
# matrix carries the supported editors; each leg runs the suite once per state of
# the optional DxMessaging integration, so one job proves both. A pull request
# and a push validate the newest editor; the nightly schedule and a manual
# dispatch add the oldest one. The nightly editor is a column of this one
# licensed job, not a second licensed lane, so the single "Unity CI Success"
# aggregate below still covers every run that proves an editor.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Exactly one cron entry, at most daily, on the protected default branch.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      unitypackage_smoke:
        description: Rehearse the Unity import archive in both editors
        type: boolean
        default: false

concurrency:
  # The organization enrollment contract (build-lock #274) requires literal
  # `cancel-in-progress: true`: a queued superseded run wastes a paid
  # self-hosted seat. Cancellation is safe for licensed work because the
  # acquire action releases before activation, the cleanup chain runs under
  # `if: always()`, and the scheduled reaper recovers a dead holder.
  # The event name is part of the group so a push to main cannot cancel a
  # manual run for another event.
  group: unity-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  runner-preflight:
    name: Self-hosted runner registration preflight
    # Dependabot and fork pull requests cannot read the organization reader-App
    # or Unity secrets, so their jobs stay static-only. This exact guard
    # expression is the enrollment policy's trusted-revision shape.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require a registered Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB","fast"]]'

  unity-tests:
    name: Unity ${{ matrix.unity-version }} EditMode
    needs: runner-preflight
    # Same guard as the preflight: fork and Dependabot pull requests cannot
    # read the organization Unity serial or build-lock App secrets.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    # Collect the dispatch counter experiment on the machine that reproduced the spikes.
    runs-on: [self-hosted, Windows, RAM-64GB, fast]
    # Leave time for license return and lock release after the maximum wait and both validation modes.
    timeout-minutes: 490
    # Contract item 3: the audit proves the per-leg editor gate and the central
    # return pins only on a matrix it can enumerate, so every axis holds literal
    # values. An include-based or generated matrix is refused.
    strategy:
      fail-fast: false
      # No max-parallel. It makes only N legs *eligible*, so every completion
      # waits for a fresh dispatch to a self-hosted runner, which is the slow
      # part of this job. The runner pool and the organization lock already
      # bound concurrency, and each leg keeps its own head guard and holder
      # suffix, so parallel legs never share a seat or a license.
      matrix:
        unity-version:
          - 2021.3.45f1
          - 6000.5.2f1
        # A pull request and a push validate only the newest editor. The oldest
        # editor joins the nightly schedule and a manual dispatch. An exclusion
        # removes whole literal cells, so every surviving leg still names one
        # literal editor for the central editor gate and the return pins.
        exclude:
          - unity-version: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '2021.3.45f1' || '' }}
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      # Contract item 3: the central immutable gate validates the runner-owned
      # editor before any credential reference or checkout. CI never installs
      # or repairs an editor; a missing editor is runner maintenance.
      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          unity-version: ${{ matrix.unity-version }}
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: EditorOnly
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python runner for analysis staging
        timeout-minutes: 5
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Setup Node for the pristine archive
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Pack the consumer archive
        id: pack
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          RELEASE_VALIDATION: ${{ inputs.unitypackage_smoke || startsWith(github.ref, 'refs/heads/release-verify/v') }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "dxaudio-archive-$env:UNITY_VERSION"
          if ($env:RELEASE_VALIDATION -eq 'true') {
            npm install --global --ignore-scripts npm@12.2.2
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the release npm version.' }
          }
          uv run --no-project .github/scripts/package_check.py --out $output

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/validate-unity-license@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-editmode
          require-resource-lifecycle: "true"
          minimum-release-cooldown-seconds: "0"
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Run EditMode tests without the optional integration
        id: run_editmode_plain
        timeout-minutes: 45
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TEST_LABEL: no-integration
          DXMESSAGING_VERSION: ""
        run: ./scripts/unity/run-editmode-tests.ps1

      - name: Run EditMode tests with the optional integration
        id: run_editmode_integration
        timeout-minutes: 45
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TEST_LABEL: integration
          DXMESSAGING_VERSION: "3.3.0"
        run: ./scripts/unity/run-editmode-tests.ps1

      - name: Report the log tail without the optional integration
        if: ${{ failure() && steps.run_editmode_plain.outcome == 'failure' }}
        timeout-minutes: 2
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          UNITY_TEST_LABEL: no-integration
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: ./scripts/unity/show-editmode-log-tail.ps1

      - name: Report the log tail with the optional integration
        if: ${{ failure() && steps.run_editmode_integration.outcome == 'failure' }}
        timeout-minutes: 2
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          UNITY_TEST_LABEL: integration
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: ./scripts/unity/show-editmode-log-tail.ps1

      - name: Verify standalone player scripts with and without the optional integration
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 25
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TEST_LABEL: consumer-archive
          DXMESSAGING_VERSION: ""
          DXAUDIO_CONSUMER_ARCHIVE: ${{ steps.pack.outputs.tarball }}
          RELEASE_VALIDATION: ${{ inputs.unitypackage_smoke || startsWith(github.ref, 'refs/heads/release-verify/v') }}
        run: |
          ./scripts/unity/run-editmode-tests.ps1 -ArchiveSmoke
          ./scripts/unity/run-editmode-tests.ps1 -IntegrationPlayerSmoke -Label consumer-archive-integration -DxMessagingVersion "3.3.0"
          if ($env:RELEASE_VALIDATION -eq 'true') {
            uv run --no-project .github/scripts/release_assets.py build $env:DXAUDIO_CONSUMER_ARCHIVE
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the Unity import archive.' }
            $archive = [IO.Path]::ChangeExtension($env:DXAUDIO_CONSUMER_ARCHIVE, '.unitypackage')
            ./scripts/unity/run-editmode-tests.ps1 -UnityImportArchive $archive -Label unitypackage-import
          }

      - name: Require current PR head after Unity validation
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: unity-tests-editmode

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-editmode
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          acquired: ${{ steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  # One always-reporting context so the default-branch ruleset requires a single
  # "Unity CI Success". It covers the one licensed job for every event, including
  # the nightly matrix. A skipped required check counts as passing, so this job
  # uses a falsifiable job-level `if: always()` plus exact per-job result checks.
  unity-ci-success:
    name: Unity CI Success
    needs:
      - runner-preflight
      - unity-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Unity CI result shape
        shell: bash
        env:
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name !=
            github.repository }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "${FORK_PR}" = "true" ] || [ "${DEPENDABOT_PR}" = "true" ]; then
            test "${RUNNER_PREFLIGHT_RESULT}" = skipped
            test "${UNITY_TESTS_RESULT}" = skipped
          else
            test "${RUNNER_PREFLIGHT_RESULT}" = success
            test "${UNITY_TESTS_RESULT}" = success
          fi
