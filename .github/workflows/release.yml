name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Validated commit from the weekly release workflow
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ -n "$EXPECTED_SHA" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: .net-tests/global.json

      - name: Test the engine-free core
        run: python3 .net-tests/run_checks.py --clean

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Pin the npm publisher
        run: npm install --global --ignore-scripts npm@12.2.2

      - name: Check and build the archives
        id: pack
        run: |
          python3 .github/scripts/package_check.py --tag "${TAG}" --out dist
          test -s dist/notes.md
          python3 .github/scripts/release_assets.py build "dist/com.wallstop-studios.dxaudio-${TAG#v}.tgz"

      - name: Stage, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.pack.outputs.prerelease }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          verify_tag() {
            git fetch --no-tags origin "refs/tags/$TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          }
          verify_tag
          python3 .github/scripts/release_assets.py stage "$TARBALL" --tag "$TAG" "${flags[@]}"
          verify_tag
          python3 .github/scripts/release_assets.py npm "$TARBALL" --tag "$TAG" "${flags[@]}"
          verify_tag
          python3 .github/scripts/release_assets.py finalize "$TARBALL" --tag "$TAG" "${flags[@]}"
          sha256sum "$TARBALL" "${TARBALL%.tgz}.unitypackage" >> "$GITHUB_STEP_SUMMARY"
