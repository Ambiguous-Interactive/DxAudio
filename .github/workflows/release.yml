name: Release

# Publishes a version tag: attaches the npm tarball to a GitHub Release, then publishes the same
# tarball to npm with trusted publishing (no token; npm adds provenance for this workflow).
#
# To release: bump "version" in package.json, add its CHANGELOG.md section, merge to main, then
#   git tag vX.Y.Z origin/main && git push origin vX.Y.Z
# Every step skips what is already done, so a failed run is fixed by re-running it, or by dispatching
# this workflow with the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing vX.Y.Z tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing
    env:
      PACKAGE: com.wallstop-studios.dxaudio
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${TAG} is not on main. Tag a commit that main contains."
            exit 1
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.x

      - name: Test the engine-free core
        run: dotnet test .net-tests --configuration Release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No registry-url: setup-node's placeholder .npmrc token would make npm skip the OIDC
          # exchange that trusted publishing needs.
          node-version: "24"
          package-manager-cache: false

      - name: Check the package and pack it
        id: pack
        run: python3 .github/scripts/package_check.py --tag "${TAG}" --out dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.pack.outputs.prerelease }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            flags=()
            if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
            gh release create "${TAG}" --verify-tag --title "DxAudio ${TAG#v}" \
              --notes-file dist/notes.md "${flags[@]}"
          fi
          assets="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          for file in "${TARBALL}" "${TARBALL}.sha256"; do
            if ! grep -qxF "$(basename "${file}")" <<<"${assets}"; then
              gh release upload "${TAG}" "${file}"
            fi
          done

      - name: Publish to npm
        env:
          NPM_TAG: ${{ steps.pack.outputs.npm_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already on npm."
            exit 0
          fi
          if ! npm view "${PACKAGE}" name >/dev/null 2>&1; then
            # npm cannot trust a workflow for a name that does not exist yet.
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${TARBALL}")"
            echo "::error::${PACKAGE} is not on npm yet, so trusted publishing cannot create it. A maintainer with npm 2FA runs, once:"
            echo "::error::npx --yes npm@12.2.2 publish ${url} --access public"
            echo "::error::npx --yes npm@12.2.2 trust github ${PACKAGE} --repo ${GITHUB_REPOSITORY} --file release.yml --allow-publish"
            exit 1
          fi
          npx --yes npm@12.2.2 publish "./${TARBALL}" --access public --tag "${NPM_TAG}"
