name: External documentation links

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-doc-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    name: Check external documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            -c .github/checks/lychee.toml
            --no-progress
            --include-fragments
            --
            README.md CHANGELOG.md "./Documentation~/**/*.md" "./Samples~/**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
