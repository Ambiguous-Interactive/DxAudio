name: Weekly auto-release

on:
  schedule:
    - cron: "0 4 * * 0"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        type: choice
        options: [preview, prepare, resume]
        default: preview
  workflow_run:
    workflows: [CI, Unity Tests, LLM Instructions Lint, External documentation links]
    branches: ["release-verify/v*"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'preview' || (github.event_name == 'schedule' && vars.AUTO_RELEASE_PAUSED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/auto_release.py preview

  release:
    if: >-
      vars.AUTO_RELEASE_PAUSED != 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.operation == 'prepare' || inputs.operation == 'resume' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare or advance the validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_VALIDATE_ONLY: ${{ vars.AUTO_RELEASE_VALIDATE_ONLY }}
          VALIDATION_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_BRANCH: ${{ github.event.workflow_run.head_branch }}
          OPERATION: ${{ inputs.operation }}
        run: |
          operation="${OPERATION:-prepare}"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then operation=completed; fi
          python3 .github/scripts/auto_release.py "$operation"
