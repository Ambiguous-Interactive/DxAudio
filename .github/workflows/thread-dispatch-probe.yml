name: DSP thread dispatch capability

on:
  push:
    branches: [probe/dsp-thread-dispatch]

permissions:
  contents: read

jobs:
  hosted:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check thread dispatch counters
        shell: pwsh
        run: ./.github/thread-dispatch-probe.ps1

  eli:
    runs-on: [self-hosted, Windows, RAM-64GB, fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check thread dispatch counters
        shell: pwsh
        run: ./.github/thread-dispatch-probe.ps1
