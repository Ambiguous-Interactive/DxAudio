[project]
name = "dxaudio-python-policy"
version = "0.0.0"
requires-python = ">=3.11.8"
dependencies = []

[dependency-groups]
dev = ["mypy==2.4.1", "pyright==1.1.414", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "A", "C4", "DTZ", "FA", "ISC",
    "ICN", "PIE", "PYI", "PT", "Q", "RET", "SIM", "TC", "ARG", "PTH", "RUF",
    "ANN", "S", "PERF",
]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S603"]
"test-*.py" = ["S101", "S603"]

[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "package_check"
follow_imports = "silent"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = ["../../.github/scripts"]
# List every new Python source here. Keep the legacy inventory explicit while migrating it.
include = [
    "../../.github/scripts/auto_release.py",
    "../../.github/scripts/compile_docs_snippets.py",
    "../../.github/scripts/release_assets.py",
    "../../.github/scripts/release_service.py",
    "../../.github/scripts/sync_docs_version.py",
    "../../.github/scripts/test_auto_release.py",
    "../../.net-tests/prepare_analyzers.py",
    "../../.net-tests/run_checks.py",
    "check.py",
]

[tool.unity-helpers-python]
